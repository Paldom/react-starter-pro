openapi: 3.0.0
info:
  title: Dashboard API
  version: 1.0.0
  description: API for dashboard and settings management

servers:
  - url: /api
    description: Development server

paths:
  /dashboard/stats:
    get:
      summary: Get dashboard statistics
      operationId: getDashboardStats
      tags:
        - dashboard
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
              example:
                totalRevenue: 125000
                subscriptions: 1234
                sales: 5678
                activeUsers: 2345

  /dashboard/chart:
    get:
      summary: Get dashboard chart data
      operationId: getDashboardChart
      tags:
        - dashboard
      responses:
        '200':
          description: Dashboard chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChartDataPoint'
              example:
                - name: 'Jan'
                  value: 4000
                - name: 'Feb'
                  value: 3000
                - name: 'Mar'
                  value: 5000
                - name: 'Apr'
                  value: 4500
                - name: 'May'
                  value: 6000
                - name: 'Jun'
                  value: 5500

  /settings:
    get:
      summary: Get user settings
      operationId: getUserSettings
      tags:
        - settings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              example:
                name: 'John Doe'
                email: 'john@example.com'
                notifications: true

    put:
      summary: Update user settings
      operationId: updateUserSettings
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
            example:
              name: 'Jane Doe'
              email: 'jane@example.com'
              notifications: false
      responses:
        '200':
          description: Updated user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              example:
                name: 'Jane Doe'
                email: 'jane@example.com'
                notifications: false

  /todos:
    get:
      summary: Get all todos
      operationId: getTodos
      tags:
        - todos
      responses:
        '200':
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              example:
                - id: '1'
                  title: 'Learn OpenAPI'
                  completed: true
                - id: '2'
                  title: 'Build Todos feature'
                  completed: false
    post:
      summary: Create a new todo
      operationId: createTodo
      tags:
        - todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoPayload'
      responses:
        '201':
          description: Created todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
    
  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the todo to retrieve or modify
    get:
      summary: Get a todo by ID
      operationId: getTodoById
      tags:
        - todos
      responses:
        '200':
          description: A single todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    put:
      summary: Update a todo by ID
      operationId: updateTodoById
      tags:
        - todos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoPayload'
      responses:
        '200':
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    delete:
      summary: Delete a todo by ID
      operationId: deleteTodoById
      tags:
        - todos
      responses:
        '204':
          description: Todo deleted
        '404':
          description: Todo not found

components:
  schemas:
    DashboardStats:
      type: object
      properties:
        totalRevenue:
          type: number
        subscriptions:
          type: number
        sales:
          type: number
        activeUsers:
          type: number
      required:
        - totalRevenue
        - subscriptions
        - sales
        - activeUsers

    ChartDataPoint:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
      required:
        - name
        - value

    UserSettings:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        notifications:
          type: boolean
      required:
        - name
        - email
        - notifications

    Todo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
      required:
        - id
        - title
        - completed

    CreateTodoPayload:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean
          default: false
      required:
        - title

    UpdateTodoPayload:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean