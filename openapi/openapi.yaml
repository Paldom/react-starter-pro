openapi: 3.0.0
info:
  title: Application API
  version: 1.0.0
  description: API for dashboard, settings, and chat streaming

servers:
  - url: /api
    description: Development server

paths:
  /dashboard/stats:
    get:
      summary: Get dashboard statistics
      operationId: getDashboardStats
      tags:
        - dashboard
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
              example:
                totalRevenue: 125000
                subscriptions: 1234
                sales: 5678
                activeUsers: 2345

  /dashboard/chart:
    get:
      summary: Get dashboard chart data
      operationId: getDashboardChart
      tags:
        - dashboard
      responses:
        '200':
          description: Dashboard chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChartDataPoint'
              example:
                - name: 'Jan'
                  value: 4000
                - name: 'Feb'
                  value: 3000
                - name: 'Mar'
                  value: 5000
                - name: 'Apr'
                  value: 4500
                - name: 'May'
                  value: 6000
                - name: 'Jun'
                  value: 5500

  /chat/stream:
    post:
      summary: Stream chat completion
      description: |
        Streams an assistant response as NDJSON (application/x-ndjson).
        Each line is a JSON object representing a ChatStreamEvent.
        The streaming response cannot be described as a standard JSON body.
      operationId: chatStream
      tags:
        - chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
            example:
              messages:
                - role: user
                  content: Hello, how are you?
      responses:
        '200':
          description: NDJSON stream of ChatStreamEvent objects
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ChatStreamEvent'

  /settings:
    get:
      summary: Get user settings
      operationId: getUserSettings
      tags:
        - settings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              example:
                name: 'John Doe'
                email: 'john@example.com'
                notifications: true

    put:
      summary: Update user settings
      operationId: updateUserSettings
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
            example:
              name: 'Jane Doe'
              email: 'jane@example.com'
              notifications: false
      responses:
        '200':
          description: Updated user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              example:
                name: 'Jane Doe'
                email: 'jane@example.com'
                notifications: false

components:
  schemas:
    DashboardStats:
      type: object
      properties:
        totalRevenue:
          type: number
        subscriptions:
          type: number
        sales:
          type: number
        activeUsers:
          type: number
      required:
        - totalRevenue
        - subscriptions
        - sales
        - activeUsers

    ChartDataPoint:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
      required:
        - name
        - value

    UserSettings:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        notifications:
          type: boolean
      required:
        - name
        - email
        - notifications

    ChatStreamMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          type: string
      required:
        - role
        - content

    ChatStreamRequest:
      type: object
      properties:
        thread_id:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatStreamMessage'
        run_config:
          type: object
          additionalProperties: true
      required:
        - messages

    TextDeltaEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - text-delta
        delta:
          type: string
      required:
        - type
        - delta

    ToolCallBeginEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - tool-call-begin
        tool_call_id:
          type: string
        tool_name:
          type: string
      required:
        - type
        - tool_call_id
        - tool_name

    ToolCallDeltaEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - tool-call-delta
        tool_call_id:
          type: string
        args_delta:
          type: string
      required:
        - type
        - tool_call_id
        - args_delta

    DoneEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - done
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - error
      required:
        - type
        - finish_reason

    ErrorEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - error
        message:
          type: string
        code:
          type: string
      required:
        - type
        - message

    ChatStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/TextDeltaEvent'
        - $ref: '#/components/schemas/ToolCallBeginEvent'
        - $ref: '#/components/schemas/ToolCallDeltaEvent'
        - $ref: '#/components/schemas/DoneEvent'
        - $ref: '#/components/schemas/ErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          text-delta: '#/components/schemas/TextDeltaEvent'
          tool-call-begin: '#/components/schemas/ToolCallBeginEvent'
          tool-call-delta: '#/components/schemas/ToolCallDeltaEvent'
          done: '#/components/schemas/DoneEvent'
          error: '#/components/schemas/ErrorEvent'