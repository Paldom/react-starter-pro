name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first — duplicates are closed.

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, complete steps starting from a fresh clone (`npm ci && npm run dev`).
      placeholder: |
        1. Run `npm run dev`
        2. Open the chat panel
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages if any.
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Mocks or real backend?
      description: Were you running with MSW mocks (`VITE_ENABLE_MOCKS=true`) or against a real API?
      options:
        - Mocks (VITE_ENABLE_MOCKS=true)
        - Real backend
        - Not sure
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version` (this project requires Node >= 24).
      placeholder: v24.2.0
    validations:
      required: true

  - type: input
    id: npm-version
    attributes:
      label: npm version
      description: Output of `npm --version`.
      placeholder: '11.3.0'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 138, Firefox 140, Safari 18...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste raw console/terminal output — automatically formatted, no backticks needed.
      render: shell
    validations:
      required: false
