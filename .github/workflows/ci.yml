name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check API freshness
        run: |
          npm run api:gen
          git diff --exit-code src/shared/api/generated/

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:coverage

      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  mutation_test:
    runs-on: ubuntu-latest
    needs: build_test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npm run test:mutation

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/html
          if-no-files-found: ignore

  # Fail-closed aggregator: the ONLY check branch protection should require.
  # if: always() + explicit result tests fail on failure, cancelled, AND skipped.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [build_test, mutation_test]
    if: always()
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        run: |
          if [ "${{ needs.build_test.result }}" != "success" ] || \
             [ "${{ needs.mutation_test.result }}" != "success" ]; then
            echo "A required job failed, was cancelled, or was skipped."
            exit 1
          fi
